
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LunarAnimator Copier</title>
  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
    }

    .box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
      background: #238636;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 350px;
      overflow: auto;
      background: #010409;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>LunarAnimator.lua</h2>
    <p>Copie o código diretamente do repositório.</p>

    <button onclick="loadCode()">Carregar código</button>
    <button onclick="copyCode()">Copiar código</button>

    <p id="status">Pronto para carregar.</p>
    <pre id="code">O código aparecerá aqui.</pre>
  </div>

  <script>
    const fileURL = "./LunarAnimator.lua";
    let luaCode = "";

    async function loadCode() {
      const status = document.getElementById("status");

      try {
        status.textContent = "Carregando...";
        const response = await fetch(fileURL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Arquivo não encontrado.");
        }

        luaCode = await response.text();
        document.getElementById("code").textContent = luaCode;
        status.textContent = "Código carregado com sucesso!";
      } catch (error) {
        status.textContent =
          "Não foi possível carregar LunarAnimator.lua. Verifique o caminho e se o GitHub Pages está ativo.";
      }
    }

    async function copyCode() {
      if (!luaCode) {
        await loadCode();
      }

      if (!luaCode) return;

      try {
        await navigator.clipboard.writeText(luaCode);
        document.getElementById("status").textContent =
          "Código copiado!";
      } catch {
        const area = document.createElement("textarea");
        area.value = luaCode;
        document.body.appendChild(area);
        area.select();

        const ok = document.execCommand("copy");
        area.remove();

        document.getElementById("status").textContent = ok
          ? "Código copiado!"
          : "Não foi possível copiar automaticamente.";
      }
    }
  </script>
</body>
</html>
